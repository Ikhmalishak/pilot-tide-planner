services:
  - type: web
    name: tidenav-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build -w packages/shared-types && npm run build -w packages/navigation-engine && npm run build -w packages/validation && npm run build -w packages/excel-parser && npm run build -w apps/api && cd apps/api && npx prisma generate
    startCommand: cd apps/api && node dist/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tidenav-db
          property: connectionString
      - key: PORT
        value: "3001"
      - key: NODE_ENV
        value: "production"
      - key: CORS_ORIGIN
        value: "https://tidenav-web.onrender.com"

  - type: static
    name: tidenav-web
    runtime: static
    region: singapore
    buildCommand: npm install && npm run build -w packages/shared-types && npm run build -w apps/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: "https://tidenav-api.onrender.com/api"

databases:
  - name: tidenav-db
    databaseName: tidenav
    user: tidenav
    plan: free
    region: singapore